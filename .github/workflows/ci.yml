name: Pivot checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install offline dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit tracked source and content
        run: python scripts/check_repository.py
      - name: Test synthetic cash-session calculations and JSON
        run: python -m unittest discover -s tests -v
      - name: Check historical command entry point
        run: python outputs/pivot_algorithm/run_pivots.py --help
